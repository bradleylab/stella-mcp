name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run lint
        run: uv run ruff check .
      - name: Run compatibility corpus tests
        run: |
          uv run python -m pytest \
            tests/test_compatibility_corpus.py \
            tests/test_external_corpus_manifest.py \
            tests/test_external_compatibility_corpus.py
      - name: Run full test suite
        run: uv run python -m pytest

  test-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          cache-suffix: sim
      - name: Install dependencies with sim extra
        run: uv sync --locked --extra dev --extra sim
      - name: Run complete simulation, analysis, and calibration suite
        run: uv run python -m pytest
      - name: Run numeric and desktop evidence tests
        run: |
          uv run python -m pytest \
            tests/test_evaluation_compare.py \
            tests/test_evaluation_desktop_parity.py \
            tests/test_evaluation_external_parity.py \
            tests/test_evaluation_package_desktop_evidence.py \
            tests/test_evaluation_numeric_fidelity_report.py
      - name: Run agent evaluator unit and retained-evidence tests
        run: |
          uv run python -m pytest \
            tests/test_evaluation_agent_runner.py \
            tests/test_evaluation_agent_evidence.py \
            tests/test_evaluation_agent_v2_evidence.py
      - name: Run deterministic MCP evaluation
        run: |
          uv run python -m evaluation.runner \
            --require sim \
            --artifact-dir "$RUNNER_TEMP/stella-evaluation-artifacts" \
            --output-json "$RUNNER_TEMP/stella-evaluation.json" \
            --output-markdown "$RUNNER_TEMP/stella-evaluation.md"
      - name: Check generated evidence is current
        run: |
          uv run python -m evaluation.numeric_fidelity_report --check
          uv run python -m evaluation.capability_matrix --check

  test-mcp-floor:
    # Exercise the declared mcp minimum (the lockfile pins the latest, so the
    # floor would otherwise never be tested) — a floor-breaking API use fails
    # here instead of on a user's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.10"
          cache-suffix: mcp-floor
      - name: Run suite against the mcp version floor
        run: uv run --with "mcp==1.19.0" --extra dev python -m pytest

  package:
    needs: [test, test-sim, test-mcp-floor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: uv sync --locked --extra dev
      - name: Build source and wheel distributions
        run: uv build
      - name: Validate distributions
        run: uv run twine check dist/*
      - name: Validate distribution metadata and bundled templates
        run: |
          uv run python scripts/check_built_wheel.py dist/*.whl
          uv run python scripts/check_built_sdist.py dist/*.tar.gz
      - name: Install core wheel in a clean environment
        run: |
          uv venv .package-venv
          uv pip install --python .package-venv/bin/python dist/*.whl
          .package-venv/bin/python -c "import stella_mcp.server"
