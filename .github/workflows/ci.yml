name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check lockfile is current
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run lint
        run: uv run ruff check .
      - name: Run compatibility corpus tests
        run: |
          uv run python -m pytest \
            tests/test_compatibility_corpus.py \
            tests/test_external_corpus_manifest.py \
            tests/test_external_compatibility_corpus.py
      - name: Run full test suite
        run: uv run python -m pytest

  test-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          cache-suffix: sim
      - name: Install dependencies with sim extra
        run: uv sync --locked --extra dev --extra sim
      - name: Run complete simulation, analysis, and calibration suite
        run: uv run python -m pytest

  test-mcp-floor:
    # Exercise the declared mcp minimum (the lockfile pins the latest, so the
    # floor would otherwise never be tested) — a floor-breaking API use fails
    # here instead of on a user's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.10"
          cache-suffix: mcp-floor
      - name: Run suite against the mcp version floor
        run: uv run --with "mcp==2.0.0" --extra dev python -m pytest

  package:
    needs: [test, test-sim, test-mcp-floor]
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  verify-release-artifact:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: stella-mcp-distributions
          path: release-archive
          skip-decompress: true
          digest-mismatch: error
      - name: Verify artifact manifest
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.package.outputs.manifest_digest }}
        run: |
          archive_path="$(find release-archive -maxdepth 1 -type f -print -quit)"
          test -n "$archive_path"
          printf '%s  %s\n' "$EXPECTED_ARTIFACT_DIGEST" "$archive_path" | sha256sum --check -
          mkdir release-dist
          unzip -q "$archive_path" -d release-dist
          cd release-dist
          printf '%s  SHA256SUMS\n' "$EXPECTED_MANIFEST_DIGEST" | sha256sum --check -
          sha256sum --check SHA256SUMS
