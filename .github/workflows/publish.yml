name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ github.event.release.prerelease == false }}
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      expected_tag: ${{ github.event.release.tag_name }}
    permissions:
      contents: read

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: stella-mcp-distributions
          path: release-archive
          skip-decompress: true
          digest-mismatch: error
      - name: Verify artifact manifest
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.build.outputs.manifest_digest }}
        run: |
          archive_path="$(find release-archive -maxdepth 1 -type f -print -quit)"
          test -n "$archive_path"
          printf '%s  %s\n' "$EXPECTED_ARTIFACT_DIGEST" "$archive_path" | sha256sum --check -
          mkdir release-dist
          unzip -q "$archive_path" -d release-dist
          cd release-dist
          printf '%s  SHA256SUMS\n' "$EXPECTED_MANIFEST_DIGEST" | sha256sum --check -
          sha256sum --check SHA256SUMS
      - name: Remove manifest from publication directory
        run: rm release-dist/SHA256SUMS
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: release-dist
