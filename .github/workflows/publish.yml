name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.10.0)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: uv sync --locked --extra dev
      - name: Validate tag and release metadata
        run: uv run python scripts/check_release_metadata.py --expected-tag "$RELEASE_TAG"
      - name: Build source and wheel distributions
        run: uv build
      - name: Validate distributions
        run: uv run twine check dist/*
      - name: Validate wheel metadata and bundled templates
        run: uv run python scripts/check_built_wheel.py dist/*.whl
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
