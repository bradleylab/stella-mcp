[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stella-mcp"
version = "0.8.0"
description = "MCP server for creating and manipulating Stella system dynamics models (.stmx files)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alex Bradley", email = "abradley@wustl.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
sim = [
    "pysd>=3.14",
]

[project.scripts]
stella-mcp = "stella_mcp.server:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stella_mcp*"]

[tool.setuptools.package-data]
"stella_mcp" = ["builtin_templates/*.stmx", "builtin_templates/*.json"]
